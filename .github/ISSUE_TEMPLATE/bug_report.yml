name: AINowBench bug report
description: Report a reproducible, non-sensitive problem in the current production release.
title: "[AINowBench Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Review the troubleshooting guide first and remove personal, customer, and account information.

  - type: input
    id: version
    attributes:
      label: AINowBench version
      placeholder: "6.0.5 Production"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows edition and build
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Relevant hardware
      description: Include processor, graphics adapter, installed memory, and system-drive type. Do not include serial numbers.
      placeholder: |
        CPU:
        GPU:
        Memory:
        System drive:
    validations:
      required: true

  - type: input
    id: stage
    attributes:
      label: Benchmark stage or result row
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact non-sensitive error text when available.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I reviewed the troubleshooting and FAQ documents.
          required: true
        - label: I removed personal, customer, and account information.
          required: true
        - label: This is not a security-sensitive report.
          required: true
