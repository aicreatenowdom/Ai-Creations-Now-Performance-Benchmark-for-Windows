name: AINowBench feature request
description: Suggest an AINowBench benchmark, documentation, usability, compatibility, or reporting improvement.
title: "[AINowBench Feature] "
body:
  - type: dropdown
    id: area
    attributes:
      label: AINowBench area
      options:
        - Graphics testing
        - Processor testing
        - Storage testing
        - Memory testing
        - Scoring and comparison
        - Local reports
        - Result upload and recovery
        - Hardware detection
        - Compatibility
        - Documentation and usability
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the AINowBench user need before describing the preferred implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: impact
    attributes:
      label: Expected benchmark or user impact

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: This request contains no private, customer, account, or security-sensitive information.
          required: true
