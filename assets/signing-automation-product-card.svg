<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Planned Microsoft Code Signing Assistant</title>
  <desc id="desc">Product card for a planned developer utility for authorized software publishing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091423"/>
      <stop offset="1" stop-color="#28203e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6cdcff"/>
      <stop offset=".55" stop-color="#8e75ff"/>
      <stop offset="1" stop-color="#ff9b45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="330" rx="26" fill="url(#bg)"/>
  <rect x="0" y="0" width="14" height="330" rx="7" fill="url(#accent)"/>
  <g transform="translate(930 55)">
    <path d="M105 0 L200 38 V112 C200 171 159 211 105 230 C51 211 10 171 10 112 V38Z" fill="#121d35" stroke="#8e75ff" stroke-width="4"/>
    <path d="M66 112 L94 140 L151 78" fill="none" stroke="#6cdcff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="105" cy="112" r="83" fill="none" stroke="#ff9b45" stroke-opacity=".35" stroke-width="3"/>
  </g>
  <text x="58" y="82" fill="#c6baff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">PLANNED PUBLIC UTILITY</text>
  <text x="55" y="139" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800">Microsoft Code Signing Assistant</text>
  <text x="58" y="181" fill="#d9e7f7" font-family="Segoe UI, Arial, sans-serif" font-size="23">For developers authorized to sign and release their own software.</text>
  <rect x="58" y="211" width="790" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="650">
    <text x="58" y="260" fill="#ffffff">STATUS: PLANNED</text>
    <text x="288" y="260" fill="#ffffff">WINDOWS</text>
    <text x="442" y="260" fill="#ffffff">FREE RELEASE INTENT</text>
    <text x="708" y="260" fill="#ffffff">OPTIONAL DONATIONS</text>
  </g>
  <text x="58" y="300" fill="#8f8aa8" font-family="Segoe UI, Arial, sans-serif" font-size="16">No public binary has been released • final name, scope, and availability remain subject to approval</text>
</svg>
