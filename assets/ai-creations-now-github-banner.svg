<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">AI Creations Now Software Development</title>
  <desc id="desc">Professional blue and orange technology banner for AI Creations Now.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061322"/>
      <stop offset="0.55" stop-color="#0b2442"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13b8ff"/>
