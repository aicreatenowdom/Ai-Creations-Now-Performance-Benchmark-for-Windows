  <g opacity=".36" stroke="#27a8ff" stroke-width="2" fill="none">
    <path d="M90 73 H180 L210 103 H315"/>
    <path d="M90 99 H142 L175 132 H270"/>
    <path d="M90 258 H166 L205 219 H308"/>
