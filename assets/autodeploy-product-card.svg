    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42d59b"/>
      <stop offset=".55" stop-color="#1f8dff"/>
      <stop offset="1" stop-color="#f7b84b"/>
